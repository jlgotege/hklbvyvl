<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Battery Charge</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1f2937;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.18);
      --text: rgba(255, 255, 255, 0.92);
      --muted: rgba(255, 255, 255, 0.60);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100svh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 900px at 20% 15%, #1d4ed8 0%, transparent 55%),
                  radial-gradient(1000px 800px at 80% 20%, #7c3aed 0%, transparent 52%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    /* Mobile-friendly inner padding */
    .page-pad {
      width: 100%;
      padding: 18px;
    }

    @media (max-width: 420px) {
      .page-pad { padding: 14px; }
    }

    body {
      display: grid;
      place-items: center;
      background: radial-gradient(1200px 900px at 20% 15%, #1d4ed8 0%, transparent 55%),
                  radial-gradient(1000px 800px at 80% 20%, #7c3aed 0%, transparent 52%),
                  linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow: hidden;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      padding: clamp(18px, 4.5vw, 28px) clamp(16px, 4vw, 22px);
      border-radius: clamp(18px, 5vw, 24px);
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }

    .battery {
      position: relative;
      width: min(380px, 86vw);
      height: clamp(130px, 34vw, 170px);
      margin: 0 auto;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.15);
      overflow: visible;
    }

    /* Inner clipping so the "cap" can sit outside without cutting */
    .battery-inner {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      overflow: hidden;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -16px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: clamp(44px, 12vw, 56px);
      border-radius: 10px;
      background: rgba(255,255,255,0.35);
    }

    .fill {
      position: absolute;
      inset: 6px;
      width: 0%;
      border-radius: 14px;
      background: linear-gradient(90deg, #22c55e, #16a34a);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
      transition: width 0.06s linear;
    }

    @media (max-width: 420px) {
      .fill { inset: 5px; }
    }

    .shine {
      position: absolute;
      inset: 6px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,0.14), transparent 40%);
      pointer-events: none;
    }

    .percent {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: clamp(34px, 10vw, 44px);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 8px 24px rgba(0,0,0,0.55);
    }

    .meta {
      margin-top: 14px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.95);
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.65);
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="page-pad">
    <main class="wrap">
    <h1>Battery</h1>
    <p>Shake to charge</p>

    <div class="battery" aria-label="Battery">
      <div class="battery-inner">
        <div class="fill" id="fill"></div>
        <div class="shine"></div>
        <div class="percent" id="percent">10%</div>
      </div>
    </div>

    <div class="meta"><span class="dot"></span><span id="status">Waiting…</span></div>
  </main>
  </div>

  <script>
    (function () {
      const startPercent = 10;
      const endPercent = 100;
      const delayMs = 1000; // start after 1 second
      const durationMs = 8000; // charging duration ~8 seconds

      const fill = document.getElementById('fill');
      const percentEl = document.getElementById('percent');
      const statusEl = document.getElementById('status');

      function setPercent(p) {
        const clamped = Math.max(0, Math.min(100, p));
        fill.style.width = clamped + '%';
        percentEl.textContent = Math.round(clamped) + '%';

        // Slight color shift for low charge
        if (clamped < 20) {
          fill.style.background = 'linear-gradient(90deg, #f97316, #ef4444)';
        } else if (clamped < 60) {
          fill.style.background = 'linear-gradient(90deg, #eab308, #22c55e)';
        } else {
          fill.style.background = 'linear-gradient(90deg, #22c55e, #16a34a)';
        }
      }

      setPercent(startPercent);

      setTimeout(() => {
        statusEl.textContent = 'Charging…';

        const t0 = performance.now();

        function tick(now) {
          const t = now - t0;
          const progress = Math.min(1, t / durationMs);
          const current = startPercent + (endPercent - startPercent) * progress;
          setPercent(current);

          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            statusEl.textContent = 'Charged';
          }
        }

        requestAnimationFrame(tick);
      }, delayMs);
    })();
  </script>
</body>
</html>
