<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Safari Optimized Unlock</title>
    <style>
        /* Блокируем любые отскоки и прокрутки */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            /* Решение для Safari: svh гарантирует, что всё влезет */
            height: 100vh;
            height: 100svh; 
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed; /* Предотвращает "резиновый" скролл в Safari */
        }

        #mainScreen {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease-out;
        }

        #home-screen {
            background-image: url('https://i.ibb.co/4Z4QhK3J/Home-Screen-i-Phone.png');
            z-index: 1;
            transform: scale(1.1);
            opacity: 0;
        }

        #lock-screen {
            background-image: url('https://i.ibb.co/5xTysWFB/Lock-Screen-i-Phone.png');
            z-index: 3;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 4;
            cursor: crosshair;
            touch-action: none;
        }

        .error-msg {
            position: absolute;
            top: 15%; /* Сместил чуть выше, чтобы в Safari было лучше видно */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
            pointer-events: none;
        }

        /* Анимация разблокировки */
        .unlocked #lock-screen {
            transform: scale(1.5);
            opacity: 0;
            pointer-events: none;
        }

        .unlocked #home-screen {
            transform: scale(1);
            opacity: 1;
        }

        .unlocked canvas {
            display: none;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        
        .shake-it {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body>

<div id="mainScreen">
    <div id="home-screen" class="layer"></div>
    <div id="lock-screen" class="layer"></div>
    <canvas id="drawCanvas"></canvas>
    <div id="errorMsg" class="error-msg">Try Again</div>
</div>

<script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const screenDiv = document.getElementById('mainScreen');
    const errorMsg = document.getElementById('errorMsg');
    
    let isDrawing = false;
    let attempts = 0;

    function resize() {
        // Используем фактическую высоту окна, которую видит Safari
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 20;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);
    resize();

    function startDrawing(e) {
        isDrawing = true;
        draw(e);
    }

    function draw(e) {
        if (!isDrawing) return;
        const x = e.clientX || (e.touches && e.touches[0].clientX);
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        ctx.beginPath();
        attempts++;
        
        if (attempts < 3) {
            errorMsg.style.opacity = '1';
            screenDiv.classList.add('shake-it');
            setTimeout(() => {
                screenDiv.classList.remove('shake-it');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                errorMsg.style.opacity = '0';
            }, 700);
        } else {
            screenDiv.classList.add('unlocked');
        }
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDrawing(e);
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        draw(e);
    }, { passive: false });
    canvas.addEventListener('touchend', stopDrawing);

</script>
</body>
</html>
