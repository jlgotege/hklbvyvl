<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Unlock Simulator</title>
    <style>
        :root {
            /* Чистое разрешение экрана iPhone 15 Pro Max */
            --screen-width: 430px;
            --screen-height: 932px;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Контейнер экрана без рамок и скруглений */
        .screen {
            width: var(--screen-width);
            height: var(--screen-height);
            position: relative;
            overflow: hidden;
            background: #000;
            user-select: none;
        }

        /* Слои изображений */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            /* Плавный переход при разблокировке */
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease-out, filter 0.5s;
        }

        #home-screen {
            background-image: url('https://i.ibb.co/4Z4QhK3J/Home-Screen-i-Phone.png');
            z-index: 1;
            transform: scale(0.9); /* Слегка уменьшен в начале */
            filter: brightness(0.4); /* Затемнен в начале */
        }

        #lock-screen {
            background-image: url('https://i.ibb.co/5xTysWFB/Lock-Screen-i-Phone.png');
            z-index: 3;
        }

        /* Холст для рисования */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 4;
            cursor: crosshair;
            touch-action: none;
        }

        /* Текстовое уведомление */
        .error-msg {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 8px; /* Небольшое скругление только у плашки сообщения */
            font-size: 18px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Логика анимации разблокировки */
        .unlocked #lock-screen {
            transform: scale(1.3);
            opacity: 0;
            pointer-events: none;
        }

        .unlocked #home-screen {
            transform: scale(1);
            filter: brightness(1);
        }

        .unlocked canvas {
            display: none;
        }

        /* Тряска при ошибке */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .shake-it {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both;
        }

    </style>
</head>
<body>

<div class="screen" id="mainScreen">
    <div id="home-screen" class="layer"></div>
    <div id="lock-screen" class="layer"></div>
    
    <canvas id="drawCanvas"></canvas>
    
    <div id="errorMsg" class="error-msg">Try Again</div>
</div>

<script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const screenDiv = document.getElementById('mainScreen');
    const errorMsg = document.getElementById('errorMsg');
    
    let isDrawing = false;
    let attempts = 0;
    const maxAttempts = 3;

    function setupCanvas() {
        canvas.width = 430;
        canvas.height = 932;
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 18; // Жирная линия
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
    }

    setupCanvas();

    function startDrawing(e) {
        isDrawing = true;
        draw(e);
    }

    function draw(e) {
        if (!isDrawing) return;
        
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        ctx.beginPath();

        attempts++;
        
        if (attempts < maxAttempts) {
            handleError();
        } else {
            unlockAction();
        }
    }

    function handleError() {
        errorMsg.style.opacity = '1';
        screenDiv.classList.add('shake-it');
        
        setTimeout(() => {
             screenDiv.classList.remove('shake-it');
        }, 300);

        setTimeout(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            errorMsg.style.opacity = '0';
        }, 700);
    }

    function unlockAction() {
        screenDiv.classList.add('unlocked');
    }

    // События мыши
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    // События тача
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDrawing(e);
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
         e.preventDefault();
        draw(e);
    }, { passive: false });
    
    canvas.addEventListener('touchend', stopDrawing);

</script>

</body>
</html>
