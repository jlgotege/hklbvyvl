<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Unlock Screen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Убираем скроллы */
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Основной контейнер на весь экран */
        #mainScreen {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Слои изображений */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover; /* Картинка всегда заполняет экран без полос */
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.6s ease-out;
        }

        #home-screen {
            background-image: url('https://i.ibb.co/4Z4QhK3J/Home-Screen-i-Phone.png');
            z-index: 1;
            transform: scale(1.1); /* Легкий зум для эффекта глубины */
            opacity: 0;
        }

        #lock-screen {
            background-image: url('https://i.ibb.co/5xTysWFB/Lock-Screen-i-Phone.png');
            z-index: 3;
        }

        /* Холст для рисования */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 4;
            cursor: crosshair;
            touch-action: none;
        }

        /* Сообщение об ошибке */
        .error-msg {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Анимация разблокировки */
        .unlocked #lock-screen {
            transform: scale(1.5);
            opacity: 0;
            pointer-events: none;
        }

        .unlocked #home-screen {
            transform: scale(1);
            opacity: 1;
        }

        .unlocked canvas {
            display: none;
        }

        /* Тряска всего экрана при ошибке */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-15px); }
            40% { transform: translateX(15px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }
        
        .shake-it {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

    </style>
</head>
<body>

<div id="mainScreen">
    <div id="home-screen" class="layer"></div>
    <div id="lock-screen" class="layer"></div>
    
    <canvas id="drawCanvas"></canvas>
    
    <div id="errorMsg" class="error-msg">Try Again</div>
</div>

<script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const screenDiv = document.getElementById('mainScreen');
    const errorMsg = document.getElementById('errorMsg');
    
    let isDrawing = false;
    let attempts = 0;
    const maxAttempts = 3;

    // Автоматическая подстройка размера холста под окно
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Перезагружаем настройки кисти после ресайза
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 20; // Очень жирная линия
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startDrawing(e) {
        isDrawing = true;
        draw(e);
    }

    function draw(e) {
        if (!isDrawing) return;
        
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        ctx.lineTo(clientX, clientY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(clientX, clientY);
    }

    function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        ctx.beginPath();

        attempts++;
        
        if (attempts < maxAttempts) {
            handleError();
        } else {
            unlock();
        }
    }

    function handleError() {
        errorMsg.style.opacity = '1';
        screenDiv.classList.add('shake-it');
        
        setTimeout(() => {
             screenDiv.classList.remove('shake-it');
        }, 400);

        setTimeout(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            errorMsg.style.opacity = '0';
        }, 800);
    }

    function unlock() {
        screenDiv.classList.add('unlocked');
    }

    // События
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDrawing(e);
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
         e.preventDefault();
        draw(e);
    }, { passive: false });
    
    canvas.addEventListener('touchend', stopDrawing);

</script>

</body>
</html>
