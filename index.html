<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 15 Pro Max Unlock</title>
    <style>
        :root {
            --iphone-width: 430px;
            --iphone-height: 932px;
            --bezel: 12px;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Phone Body */
        .iphone {
            width: var(--iphone-width);
            height: var(--iphone-height);
            background: #000;
            border-radius: 55px;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 4px 2px #444;
            padding: var(--bezel);
            box-sizing: border-box;
            user-select: none;
            transform-origin: center bottom;
        }

        /* Screen Container */
        .screen-container {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 43px;
            position: relative;
            overflow: hidden;
            -webkit-mask-image: -webkit-radial-gradient(white, black);
        }

        /* Layers */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease-out;
        }

        #home-screen {
            background-image: url('https://i.ibb.co/4Z4QhK3J/Home-Screen-i-Phone.png');
            z-index: 1;
            transform: scale(0.85);
            filter: brightness(0.5);
        }

        #lock-screen {
            background-image: url('https://i.ibb.co/5xTysWFB/Lock-Screen-i-Phone.png');
            z-index: 3;
            transform-origin: center center;
        }

        /* Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 4;
            cursor: crosshair;
            touch-action: none;
        }

        /* Error Message */
        .error-msg {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            z-index: 5;
            pointer-events: none;
            white-space: nowrap;
        }
        
        /* Unlock Animations */
        .unlocked #lock-screen {
            transform: scale(1.2) translateY(-20px);
            opacity: 0;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.3, 0, 0.2, 1), opacity 0.4s ease-in;
        }

        .unlocked #home-screen {
            transform: scale(1);
            filter: brightness(1);
        }

        .unlocked canvas {
            display: none;
        }

        /* Shake Animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        
        .shake-it {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

    </style>
</head>
<body>

<div class="iphone" id="phone">
    <div class="screen-container">
        <div id="home-screen" class="layer"></div>
        <div id="lock-screen" class="layer"></div>
        
        <canvas id="drawCanvas"></canvas>
        
        <div id="errorMsg" class="error-msg">Try Again</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    const phone = document.getElementById('phone');
    const errorMsg = document.getElementById('errorMsg');
    
    let isDrawing = false;
    let attempts = 0;
    const maxAttempts = 3;

    function setupCanvas() {
        const screenRect = document.querySelector('.screen-container').getBoundingClientRect();
        canvas.width = screenRect.width;
        canvas.height = screenRect.height;
        
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 15; // Wide drawing line
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(255,255,255, 0.6)';
    }

    setupCanvas();
    window.addEventListener('resize', setupCanvas);

    function startDrawing(e) {
        isDrawing = true;
        draw(e);
    }

    function draw(e) {
        if (!isDrawing) return;
        
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
    }

    function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        ctx.beginPath();

        attempts++;
        
        if (attempts < maxAttempts) {
            handleError();
        } else {
            unlockPhone();
        }
    }

    function handleError() {
        errorMsg.style.opacity = '1';
        phone.classList.add('shake-it');
        
        setTimeout(() => {
             phone.classList.remove('shake-it');
        }, 400);

        setTimeout(() => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            errorMsg.style.opacity = '0';
        }, 800);
    }

    function unlockPhone() {
        phone.classList.add('unlocked');
    }

    // Mouse Listeners
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    // Touch Listeners
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDrawing(e);
    }, { passive: false });
    
    canvas.addEventListener('touchmove', (e) => {
         e.preventDefault();
        draw(e);
    }, { passive: false });
    
    canvas.addEventListener('touchend', stopDrawing);

</script>

</body>
</html>
